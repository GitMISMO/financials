<!doctype html>
<html lang="en" data-rs-gate>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the page's own font, so the opening card looks the same before and after the page arrives -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<title>MISMO Money</title>
<!--
  MISMO Money on resources.mismo.org: the public shell.

  This page holds no MISMO figures, names or records, and no secrets. After
  sign-in it reads the application itself (app/) and its records (data/) from
  the PRIVATE repository GitMISMO/financials-data, through the save relay,
  which checks on every request that the person signed in may open MISMO
  Money. Signed out, or without access, nothing of it reaches the browser.

  shim.js is the door to the relay. The loader below runs the application
  once the shim has read every record, so no figure is ever drawn half-loaded.
-->
<script>
/* the shared MISMO theme, set before anything is drawn so dark mode never flashes light */
(function(){ try{ var t = localStorage.getItem('mismo.portal.theme'); if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); }catch(e){} })();
</script>
<style>
  :root{ --mm-bg:#f4f7fa; --mm-card:#ffffff; --mm-line:#d7e3ec; --mm-ink:#0d314c; --mm-ink2:#456179; --mm-accent:#0d314c; --mm-sky:#74bfeb; --mm-ink3:#7794aa; --mm-ocard:#ffffff; --mm-oink:#0d314c; --mm-oink2:#456179; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --mm-bg:#0b1a26; --mm-card:#102536; --mm-line:#24425a; --mm-ink:#e6eef5; --mm-ink2:#a9bfd1; --mm-accent:#74bfeb; --mm-ink3:#7a9db4; --mm-ocard:#0d2837; --mm-oink:#e9f4fb; --mm-oink2:#a6c5d9; } }
  :root[data-theme="dark"]{ --mm-bg:#0b1a26; --mm-card:#102536; --mm-line:#24425a; --mm-ink:#e6eef5; --mm-ink2:#a9bfd1; --mm-accent:#74bfeb; --mm-ink3:#7a9db4; --mm-ocard:#0d2837; --mm-oink:#e9f4fb; --mm-oink2:#a6c5d9; }
  html,body{ margin:0; background:var(--mm-bg); }
  #mm-gate{ position:fixed; inset:0; z-index:9400; display:flex; align-items:center; justify-content:center; padding:16px;
    background:var(--mm-bg); font-family:"IBM Plex Sans",system-ui,sans-serif; }
  #mm-gate[hidden]{ display:none; }
  #mm-gate .card{ max-width:420px; width:100%; background:var(--mm-card); border:1px solid var(--mm-line); border-radius:12px; padding:28px 26px; box-sizing:border-box; }
  #mm-gate .card.wait{ animation:mmwait .25s ease .7s both; }
  @keyframes mmwait{ from{opacity:0} to{opacity:1} }
  #mm-gate .ey{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mm-ink2); margin-bottom:6px; }
  #mm-gate h1{ font-size:21px; margin:0 0 10px; color:var(--mm-ink); font-weight:700; }
  #mm-gate p{ font-size:14px; line-height:1.5; margin:0 0 18px; color:var(--mm-ink2); }
  #mm-gate button{ font:inherit; font-size:14px; font-weight:600; padding:10px 18px; border-radius:8px; border:1px solid var(--mm-accent);
    background:var(--mm-accent); color:var(--mm-card); cursor:pointer; }
  #mm-gate .bar{ height:4px; border-radius:2px; background:var(--mm-line); overflow:hidden; }
  #mm-gate .bar i{ display:block; height:100%; width:0; background:var(--mm-sky); transition:width .2s; }
  /* the opening card: the same card as Member 360's opening screen, and the same one the page
     itself shows next (app/index.html, MM_OPENING), so opening reads as one screen */
  html.mmo-on, html.mmo-on body{ overflow:hidden; }
  #mm-gate.opening{ background:radial-gradient(120% 90% at 100% 0%,rgba(116,191,235,.18),transparent 55%),linear-gradient(160deg,#10324a,#0b2436); }
  #mm-gate .mmo-card{ max-width:440px; width:100%; box-sizing:border-box; background:var(--mm-ocard); color:var(--mm-oink); border:1px solid rgba(116,191,235,.3);
    border-radius:12px; padding:28px 26px; box-shadow:0 24px 60px -24px rgba(0,0,0,.6); }
  #mm-gate .mmo-card{ font-size:14px; line-height:1.5; }
  #mm-gate .mmo-card h1{ letter-spacing:-.012em; }
  #mm-gate .mmo-card .ey{ color:var(--mm-ink3); }
  #mm-gate .mmo-card h1, #mm-gate .mmo-t, #mm-gate .mmo-list li.ok{ color:var(--mm-oink); }
  #mm-gate .mmo-card p{ margin:0 0 16px; color:var(--mm-oink2); }
  #mm-gate .mmo-card p b{ font-variant-numeric:tabular-nums; }
  #mm-gate .mmo-clock{ display:flex; align-items:flex-end; gap:8px; margin:0 0 10px; }
  #mm-gate .mmo-t{ display:inline-flex; font-size:34px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  /* the clock's digits and the bar move by the browser's compositor, so they keep time while the
     page is busy (Jonna, 1 November 2026: the seconds stuttered, then jumped); the same as the page's card */
  #mm-gate .mmo-t .d{ display:block; height:1em; overflow:hidden; }
  #mm-gate .mmo-t .d i{ display:block; font-style:normal; will-change:transform; animation:mmoD10 10s steps(10,end) infinite; }
  #mm-gate .mmo-t .d i b{ display:block; height:1em; font-weight:inherit; }
  #mm-gate .mmo-t .d.s10 i{ animation:mmoD6 60s steps(6,end) infinite; }
  #mm-gate .mmo-t .d.m i{ animation:mmoD10 600s steps(10,end) infinite; }
  @keyframes mmoD10{ from{ transform:translateY(0) } to{ transform:translateY(-10em) } }
  @keyframes mmoD6{ from{ transform:translateY(0) } to{ transform:translateY(-6em) } }
  #mm-gate .mmo-of{ font-size:12.5px; line-height:1.2; padding-bottom:3px; color:var(--mm-ink3); white-space:nowrap; }
  #mm-gate .mmo-bar{ height:5px; border-radius:3px; background:rgba(116,191,235,.2); overflow:hidden; margin:0 0 16px; }
  #mm-gate .mmo-bar i{ display:block; height:100%; width:100%; transform-origin:0 50%; transform:scaleX(0); will-change:transform;
    background:linear-gradient(90deg,#74bfeb,#0d314c); animation:mmoBar 30s linear forwards; }
  @keyframes mmoBar{ 0%{ transform:scaleX(0) } 50%{ transform:scaleX(.9) } 100%{ transform:scaleX(.97) } }
  #mm-gate .mmo-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
  #mm-gate .mmo-list li{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--mm-ink3); white-space:nowrap; }
  #mm-gate .mmo-list li i{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(116,191,235,.55); border-top-color:transparent; box-sizing:border-box;
    flex:none; position:relative; animation:mmoSpin 1s linear infinite; }
  #mm-gate .mmo-list li.ok i{ animation:none; border-color:#2e9e6a; background:#2e9e6a; }
  #mm-gate .mmo-list li.ok i::after{ content:""; position:absolute; left:4px; top:1px; width:4px; height:8px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  #mm-gate .mmo-note{ font-size:12.5px; color:var(--mm-ink3); margin-top:12px; min-height:1px; }
  @keyframes mmoSpin{ to{ transform:rotate(360deg) } }
  @media (prefers-reduced-motion: reduce){ #mm-gate .mmo-list li i{ animation:none } }
</style>
<script src="/assets/session.js"></script>
<script src="shim.js"></script>
</head>
<body>
<div id="mm-gate"></div>
<script>
/* ============================================================================
   The loader: after sign-in, read the application from the private repository
   and run it here, exactly as the original page ran it.

   app/manifest.json lists every file of the application. Each is read through
   the relay and handed to the page as a local (blob:) address, so the
   application's own references (styles.css, engine.js, ...) find them without
   change. Its scripts run one after another, in the order the page lists them.
   ========================================================================== */
(function(){
  'use strict';
  var gate = document.getElementById('mm-gate');
  var TYPES = { js:'text/javascript', css:'text/css', html:'text/html', json:'application/json', svg:'image/svg+xml', png:'image/png' };
  function card(h, p, opts){
    opts = opts || {};
    gate.hidden = false; stopOpening(); gate.className = '';
    gate.innerHTML = '<div class="card' + (opts.wait ? ' wait' : '') + '"><div class="ey">MISMO Money</div><h1></h1><p></p></div>';
    gate.querySelector('h1').textContent = h; gate.querySelector('p').textContent = p;
    var c = gate.querySelector('.card');
    if(opts.bar){ var b = document.createElement('div'); b.className = 'bar'; b.innerHTML = '<i></i>'; c.appendChild(b); }
    if(opts.button){ var btn = document.createElement('button'); btn.type = 'button'; btn.textContent = opts.button; btn.addEventListener('click', opts.onClick); c.appendChild(btn); }
  }
  /* how long opening usually takes on this computer: the middle of the last five openings
     the application timed (its own "Reading" note says the same), 15 seconds the first time */
  function usual(){
    var a = [];
    try{ a = JSON.parse(localStorage.getItem('mm.openSeconds') || '[]'); }catch(e){}
    a = (Array.isArray(a) ? a : []).filter(function(x){ return typeof x === 'number' && x > 0 && x < 600; }).sort(function(x, y){ return x - y; });
    var n = a.length ? Math.max(1, Math.ceil(a[Math.floor(a.length / 2)])) : 15;
    return ' This usually takes about ' + n + ' seconds.';
  }
  function progress(f){ var i = gate.querySelector('.bar i'); if(i) i.style.width = Math.round(f * 100) + '%'; }

  /* The opening card (Jonna, 1 November 2026: "do the loading screen like member 360 did it"):
     each step ticked as it finishes, a running clock and how long opening usually takes. The
     records and the page are read here; the page itself then shows the same card and ticks the
     last two once every figure is final (app/index.html). The clock starts now (MM_OPEN_T0), and
     the page's card carries it on. */
  var OPEN_STEPS = ['Saved Records', 'The Page', 'Figures Worked Out', 'Final Figures'], openOk = [false, false, false, false], openT = null;
  function usualN(){ var m = usual().match(/(\d+)/); return m ? +m[1] : 15; }
  function opening(){
    if(typeof window.MM_OPEN_T0 !== 'number') window.MM_OPEN_T0 = performance.now();
    if(!gate.classList.contains('opening')){
      gate.hidden = false; gate.className = 'opening';
      gate.innerHTML = '<div class="mmo-card" role="status" aria-live="polite"><div class="ey">MISMO Money</div><h1>Opening MISMO Money…</h1>' +
        '<p>Loading every record so the figures you see are final. This usually takes about <b class="mmo-u"></b> seconds.</p>' +
        '<div class="mmo-clock"><span class="mmo-t" aria-hidden="true"></span><span class="mmo-of"></span></div>' +
        '<div class="mmo-bar"><i></i></div><ul class="mmo-list"></ul><div class="mmo-note"></div></div>';
      gate.querySelector('.mmo-t').innerHTML = digits('m', 10) + '<span>:</span>' + digits('s10', 6) + digits('s1', 10);
      gate.querySelector('.mmo-u').textContent = usualN();
      gate.querySelector('.mmo-of').textContent = 'of about ' + usualN() + 's';
      var list = gate.querySelector('.mmo-list');
      OPEN_STEPS.forEach(function(n){ var li = document.createElement('li'); li.innerHTML = '<i></i><span></span>'; li.querySelector('span').textContent = n; list.appendChild(li); });
    }
    syncOpening();
    paintOpening();
    if(!openT) openT = setInterval(paintOpening, 150);
  }
  function digits(cls, n){ var h = '<span class="d ' + cls + '"><i>'; for(var k = 0; k < n; k++) h += '<b>' + k + '</b>'; return h + '</i></span>'; }
  /* the clock and the bar start at the moment opening began (their animations' start time),
     however late the browser first draws them */
  function syncOpening(){
    var bar = gate.querySelector('.mmo-bar i'); if(!bar) return;
    bar.style.animationDuration = (2 * usualN()) + 's';
    var els = Array.prototype.slice.call(gate.querySelectorAll('.mmo-t .d i')).concat([bar]);
    try{ els.forEach(function(e){ e.getAnimations().forEach(function(a){ a.startTime = window.MM_OPEN_T0; }); }); }
    catch(e){ var el = Math.max(0, (performance.now() - window.MM_OPEN_T0) / 1000); els.forEach(function(x){ x.style.animationDelay = (-el) + 's'; }); }
  }
  function paintOpening(){
    var list = gate.querySelector('.mmo-list'); if(!list) return;
    Array.prototype.forEach.call(list.children, function(li, i){ li.classList.toggle('ok', openOk[i]); });
  }
  function openStep(i){ openOk[i] = true; if(gate.classList.contains('opening')) paintOpening(); }
  function stopOpening(){ if(openT){ clearInterval(openT); openT = null; } }

  window.MM_GATE = function(kind, msg){
    if(kind === 'loading') opening();
    else card('MISMO Money Couldn’t Load', msg || 'Something went wrong.', { button:'Try Again', onClick:function(){ location.reload(); } });
  };

  var BLOBS = {};
  /* the application's inline loader reads its biggest files with XMLHttpRequest, by name */
  var xopen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(m, u){
    var a = Array.prototype.slice.call(arguments);
    if(typeof u === 'string' && BLOBS[u]) a[1] = BLOBS[u];
    return xopen.apply(this, a);
  };
  function text(bytes){ return new TextDecoder('utf-8').decode(bytes); }

  /* The page's own files are read as soon as the sign-in is accepted, at the same time as the
     records (shim.js calls this), not after them. They arrive as a few packs (app/pack-<n>.mmpack,
     the files laid end to end, cut apart here by the manifest's byte counts) rather than one
     request a file: every request is a round trip to GitHub through the relay. A manifest
     without packs is read file by file, as before. Nothing is run until the records are in.
     A file too big for one relay answer comes in pieces ({piece, pieces} in the packs, 27 October
     2026), joined here in order before it is checked. */
  var appRead = null, appFrac = 0;
  function readTheApp(){
    var R = window.__mmRelay, got = {}, pieces = {}, done = 0;
    return R.readApp('app/manifest.json').then(function(b){
      var man = JSON.parse(text(b));
      var jobs = (man.packs && man.packs.length) ? man.packs.map(function(p){
        return { path:p.path, bytes:p.bytes, take:function(bytes){
          p.files.forEach(function(f){
            if(f.at + f.bytes > bytes.length) throw new Error(f.path + ' is missing from ' + p.path + '.');
            var b = bytes.subarray(f.at, f.at + f.bytes);
            if(f.pieces) (pieces[f.path] = pieces[f.path] || { n:f.pieces, list:[] }).list[f.piece] = b;
            else got[f.path] = b;
          });
        } };
      }) : (man.files || []).map(function(f){
        return { path:f.path, bytes:f.bytes, take:function(bytes){ got[f.path] = bytes; } };
      });
      var i = 0;
      function next(){
        if(i >= jobs.length) return Promise.resolve();
        var j = jobs[i++];
        return R.readApp('app/' + j.path).then(function(bytes){
          if(typeof j.bytes === 'number' && bytes.length !== j.bytes) throw new Error(j.path + ' arrived with ' + bytes.length + ' bytes, not ' + j.bytes + '.');
          j.take(bytes); done++; appFrac = done / jobs.length; progress(appFrac);
        }).then(next);
      }
      var lanes = []; for(var k = 0; k < Math.min(6, jobs.length); k++) lanes.push(next());
      return Promise.all(lanes).then(function(){
        Object.keys(pieces).forEach(function(p){
          var x = pieces[p], n = 0, at = 0;
          for(var k = 0; k < x.n; k++){ if(!x.list[k]) throw new Error(p + ' is missing a piece.'); n += x.list[k].length; }
          var all = new Uint8Array(n);
          x.list.forEach(function(b){ all.set(b, at); at += b.length; });
          got[p] = all;
        });
        (man.files || []).forEach(function(f){
          if(!got[f.path]) throw new Error(f.path + ' did not arrive.');
          if(typeof f.bytes === 'number' && got[f.path].length !== f.bytes) throw new Error(f.path + ' arrived with ' + got[f.path].length + ' bytes, not ' + f.bytes + '.');
        });
        return { man:man, got:got };
      });
    });
  }
  window.MM_PREFETCH = function(){
    if(!appRead){
      appRead = readTheApp();
      appRead.then(function(){ openStep(1); }, function(){});
      appRead.catch(function(){ appRead = null; });   /* a failed read is tried again when the page is started */
    }
    return appRead;
  };

  window.MM_START = function(){
    var R = window.__mmRelay;
    /* the first time only: the store is empty, so offer to load the records moved across
       from the original page (a backup file kept by Jonna, never committed by hand) */
    if(!Object.keys((R.index() || {}).docs || {}).length && window.ResourcesSession && window.ResourcesSession.canEdit(R.config.PROJECT) && !window.MM_SKIP_RESTORE){
      return firstLoad(R);
    }
    openStep(0); opening();
    window.MM_PREFETCH().then(function(r){
      openStep(1);
      Object.keys(r.got).forEach(function(p){
        var ext = (p.split('.').pop() || '').toLowerCase();
        BLOBS[p] = URL.createObjectURL(new Blob([r.got[p]], { type:(TYPES[ext] || 'application/octet-stream') + (/^(js|css|html|json)$/.test(ext) ? ';charset=utf-8' : '') }));
      });
      return run(text(r.got[r.man.entry || 'index.html']));
    }).catch(function(e){
      if(e && e.code) R.status.lastError = e.code;
      window.MM_GATE('error', (e && e.code && R.why()) || (e && e.message) || 'The page could not be read.');
    });
  };

  function firstLoad(R){
    card('MISMO Money Has No Records Yet', 'Load the backup taken from the original page. Every record is saved to the private data store, then the page opens.',
      { button:'Choose the Backup File', onClick:function(){ pick.click(); } });
    var skip = document.createElement('button'); skip.type = 'button'; skip.textContent = 'Open Empty';
    skip.style.cssText = 'margin-left:8px;background:transparent;color:var(--mm-ink)';
    skip.addEventListener('click', function(){ window.MM_SKIP_RESTORE = true; window.MM_START(); });
    gate.querySelector('.card').appendChild(skip);
    var pick = document.createElement('input'); pick.type = 'file'; pick.accept = '.json,application/json'; pick.hidden = true;
    gate.appendChild(pick);
    pick.addEventListener('change', function(){
      var f = pick.files && pick.files[0]; if(!f) return;
      f.text().then(function(t){
        var backup = JSON.parse(t), n = 0;
        Object.keys(backup).forEach(function(c){ n += Object.keys(backup[c] || {}).length; });
        if(!n) throw new Error('That file has no records in it.');
        card('Saving ' + n + ' Records…', 'Keep this tab open. They go to the private data store a few at a time.', { bar:true });
        var tick = setInterval(function(){ progress(Math.min(1, Object.keys((R.index() || {}).docs || {}).length / n)); }, 500);
        return R.restore(backup).then(function(saved){ clearInterval(tick); return saved; });
      }).then(function(saved){
        card('Saved ' + saved + ' Records', 'Opening MISMO Money…', { bar:true });
        setTimeout(function(){ location.reload(); }, 800);
      }).catch(function(e){
        window.MM_GATE('error', 'The backup was not loaded: ' + ((e && e.message) || 'unknown error') + ' Nothing else was changed.');
      });
    });
  }

  function run(html){
    var t = document.createElement('template');
    t.innerHTML = html;
    var frag = t.content;
    var title = frag.querySelector('title');
    if(title){ document.title = 'MISMO Money'; title.remove(); }
    var waits = [];
    Array.prototype.forEach.call(frag.querySelectorAll('link[href]'), function(l){
      var h = l.getAttribute('href');
      if(BLOBS[h]){ l.setAttribute('href', BLOBS[h]); }
      if(l.rel === 'stylesheet') waits.push(new Promise(function(res){ l.addEventListener('load', res); l.addEventListener('error', res); setTimeout(res, 8000); }));
    });
    /* everything goes in under the gate; the gate stays on top until the scripts have run */
    var scripts = Array.prototype.slice.call(frag.querySelectorAll('script'));
    /* the page fills in under the opening card without a scroll bar, so the card does not shift (the page's own card takes this over) */
    if(gate.classList.contains('opening')) document.documentElement.classList.add('mmo-on');
    document.body.insertBefore(frag, gate);
    var mast = document.querySelector('.mast-right');
    if(mast && !document.getElementById('rs-account')){
      var acc = document.createElement('div'); acc.id = 'rs-account'; mast.appendChild(acc);
      if(window.ResourcesSession && window.ResourcesSession.mount) window.ResourcesSession.mount(acc);
    }
    var chain = Promise.all(waits);
    scripts.forEach(function(old){
      chain = chain.then(function(){
        return new Promise(function(res){
          var s = document.createElement('script');
          Array.prototype.forEach.call(old.attributes, function(a){ if(a.name !== 'src') s.setAttribute(a.name, a.value); });
          var src = old.getAttribute('src');
          if(src){
            s.src = BLOBS[src] || src; s.async = false;
            s.onload = res; s.onerror = function(){ console.error('MISMO Money: ' + src + ' did not run'); res(); };
            old.parentNode.replaceChild(s, old);
          } else {
            s.textContent = old.textContent;
            old.parentNode.replaceChild(s, old);
            res();
          }
        });
      });
    });
    return chain.then(function(){
      requestAnimationFrame(function(){ stopOpening(); gate.hidden = true; gate.innerHTML = ''; gate.className = ''; if(!document.getElementById('mmo')) document.documentElement.classList.remove('mmo-on'); document.documentElement.classList.add('mm-ready'); });
    });
  }
})();
</script>
</body>
</html>
